name: Asynqmon ARM64 mirror

# hibiken/asynqmon publishes amd64-only Docker images. The Pi 5 cluster
# is arm64, so the upstream image fails to pull. This workflow rebuilds
# upstream's source for arm64 using our custom multi-arch Dockerfile
# (.github/docker/asynqmon.Dockerfile) and pushes the resulting image
# to GHCR (ghcr.io/<owner>/recess-asynqmon). recess-deploy points its
# asynqmon Deployment at our mirror image.
#
# Why a custom Dockerfile and not upstream's: upstream hardcodes
# GOARCH=amd64 and uses an alpine+npm combo old enough that the React
# frontend yarn build fails. Our Dockerfile uses node:18-alpine for the
# frontend and TARGETOS/TARGETARCH for the Go build stage so buildx can
# emit arm64 binaries.
#
# Trigger model:
#   - manual (workflow_dispatch) with a version input — pin to a specific
#     hibiken/asynqmon tag (e.g. 0.7.2).
#   - monthly cron — re-build the same pinned version against current
#     base images so we pick up base-OS security fixes without waiting
#     for upstream to re-tag.
#
# Bumping the asynqmon version: edit ASYNQMON_VERSION below, run
# workflow_dispatch with the new value, then update the image tag in
# recess-deploy/infra/k8s/asynqmon/deployment.yaml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'hibiken/asynqmon git tag to mirror (e.g. v0.7.2)'
        required: true
        default: 'v0.7.2'
  # Cron disabled until the build is known-green end to end. The mirror
  # currently fails at yarn build with openssl-legacy issues — see
  # P3.6 Phase 4 in ROADMAP.md. Re-enable the schedule block below once
  # a manual run succeeds; pinning the version + monthly base-image
  # refresh is still the long-term plan.
  # schedule:
  #   - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # Default version when triggered by cron — keep in sync with
  # recess-deploy/infra/k8s/asynqmon/deployment.yaml.
  DEFAULT_VERSION: v0.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${DEFAULT_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Strip the leading "v" for the image tag (deployment uses 0.7.2,
          # the upstream tag is v0.7.2). Both tags get pushed.
          echo "tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Two checkouts: this repo holds our custom Dockerfile;
      # hibiken/asynqmon@<tag> is the actual source we build against.
      - name: Checkout recess (for custom Dockerfile)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: recess

      - name: Checkout hibiken/asynqmon
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: hibiken/asynqmon
          ref: ${{ steps.version.outputs.version }}
          path: asynqmon

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3.9.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push (arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.9.0
        with:
          # Build context = the asynqmon source tree.
          # Dockerfile = our custom multi-arch one from the recess repo.
          context: ./asynqmon
          file: ./recess/.github/docker/asynqmon.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-asynqmon:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-asynqmon:latest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.9.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-asynqmon@${DIGEST}
