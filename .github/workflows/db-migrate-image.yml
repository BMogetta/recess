name: DB Migrate Image

# Builds and pushes the recess-db-migrate image whenever shared/db/**
# changes on main. The image is consumed by the ArgoCD-managed Job at
# recess-deploy/infra/k8s/data/db-migrations/job.yaml (sync-wave: -10).
#
# Tagging: `:latest` for ArgoCD (with imagePullPolicy: Always so each sync
# pulls the current rolling tag) + `:sha-<short>` for forensic traceability.
# release-please does not manage this image (different cadence — it changes
# only when the schema does, not on per-service feature work).

on:
  push:
    branches: [main]
    paths:
      - 'shared/db/**'
      - '.github/workflows/db-migrate-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.9.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.9.0
        with:
          context: ./shared/db
          file: shared/db/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate:sha-${{ steps.sha.outputs.short }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.9.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate@${DIGEST}
