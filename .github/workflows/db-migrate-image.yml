name: DB Migrate Image

# Builds and pushes the recess-db-migrate image whenever shared/db/**
# changes on main. The image is consumed by the ArgoCD-managed Job at
# recess-deploy/infra/k8s/data/db-migrations/job.yaml (sync-wave: -10).
#
# Tagging: `:latest` for ArgoCD (with imagePullPolicy: Always so each sync
# pulls the current rolling tag) + `:sha-<short>` for forensic traceability.
# release-please does not manage this image (different cadence — it changes
# only when the schema does, not on per-service feature work).

on:
  push:
    branches: [main]
    paths:
      - 'shared/db/**'
      - '.github/workflows/db-migrate-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3.9.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6.9.0
        with:
          context: ./shared/db
          file: shared/db/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate:sha-${{ steps.sha.outputs.short }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.9.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/recess-db-migrate@${DIGEST}
